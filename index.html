<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="Contact OneCare, call, WhatsApp, or get directions.">
  <title>OneCare | Get in touch</title>
  <style>
    :root{color-scheme:light;--ink:#183a32;--muted:#63756e;--paper:#f7f5f0;--green:#146b52;--lime:#d8ee9b;--line:#e2e4dc}
    *{box-sizing:border-box} body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);padding:32px 26px 26px;background:#fff;border:1px solid #e9e9e2;border-radius:28px;box-shadow:0 18px 60px #183a3212}
    .mark{width:58px;height:58px;border-radius:18px;background:var(--lime);display:grid;place-items:center;color:var(--green);font-weight:850;font-size:20px;letter-spacing:-1px}
    .eyebrow{margin:28px 0 8px;color:var(--green);font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(34px,9vw,44px);line-height:1.04;letter-spacing:-.055em}
    .intro{margin:14px 0 28px;color:var(--muted);font-size:16px;line-height:1.6}
    .actions{display:grid;gap:12px}
    .button{min-height:62px;padding:0 19px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:14px;color:var(--ink);background:white;text-decoration:none;font-weight:700;font-size:16px;transition:transform .15s,box-shadow .15s,border-color .15s}
    .button:hover{transform:translateY(-1px);border-color:#aab9af;box-shadow:0 8px 18px #183a3210}.button:focus-visible{outline:3px solid #99be64;outline-offset:3px}
    .button.primary{background:#0d664d;color:white;border-color:#0d664d}.button.primary:hover{background:#09563f}
    .icon{width:34px;height:34px;border-radius:11px;background:#edf4e9;display:grid;place-items:center;flex:none;color:var(--green)}.primary .icon{background:#ffffff24;color:white}
    .icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .arrow{margin-left:auto;opacity:.62;font-size:20px}
    footer{margin:24px 2px 0;padding-top:17px;border-top:1px solid var(--line);font-size:12px;color:#7b8982;line-height:1.55}
    @media(max-width:380px){body{padding:14px}main{padding:26px 20px 22px;border-radius:24px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">OC</div>
    <p class="eyebrow">Here for you</p>
    <h1>Let’s connect.</h1>
    <p class="intro">Reach OneCare in the way that works best for you.</p>
    <nav class="actions" aria-label="Contact options">
      <a class="button primary" id="whatsapp" href="#">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/><path d="M9 9c.4 2 2 3.6 4 4l1-1 2 1c-.2 1-1 2-2.2 2-3.7 0-7.8-4-7.8-7.5C6 6.3 7 5.5 8 5.5l1 2.1L9 9Z"/></svg></span>
        WhatsApp OneCare <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="button" id="call" href="#">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3H5a2 2 0 0 0-2 2c0 8.8 7.2 16 16 16a2 2 0 0 0 2-2v-2l-5-2-2 2a14 14 0 0 1-6-6l2-2-2-5Z"/></svg></span>
        Call <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="button" id="directions" href="#" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        Get directions <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer>OneCare · We’re glad you’re here.</footer>
  </main>
  <script>
    // Update these values, then publish this page at a URL you control.
    // Keep the same page URL on your QR code; you can change these destinations later.
    const CONTACT = {
      phone: "919526735154", // International format, digits only
      whatsappMessage: "Hi OneCare, I found your contact page.",
      directionsUrl: "https://maps.app.goo.gl/zDWGBvbfjYMKLPvX9" // OneCare location in Google Maps
    };

    const setLink = (id, value) => {
      const link = document.getElementById(id);
      if (value) link.href = value;
      else {
        link.addEventListener("click", event => {
          event.preventDefault();
          alert("Please add OneCare’s contact details in the CONTACT settings before publishing this page.");
        });
      }
    };
    setLink("whatsapp", CONTACT.phone
      ? `https://wa.me/${CONTACT.phone.replace(/\D/g, "")}?text=${encodeURIComponent(CONTACT.whatsappMessage)}`
      : "");
    setLink("call", CONTACT.phone ? `tel:+${CONTACT.phone.replace(/\D/g, "")}` : "");
    setLink("directions", CONTACT.directionsUrl);
  </script>
</body>
</html>
